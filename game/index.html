<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DUSTLINE — Tactical FPS on Helio Flats</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #171009;
    font-family: "Segoe UI", system-ui, sans-serif; color: #f5ead2; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .hidden { display: none !important; }
  #hud-top { position: absolute; top: 14px; left: 0; right: 0; text-align: center; }
  #hud-timer { font-size: 30px; font-weight: 700; letter-spacing: 2px; color: #f5ead2;
    text-shadow: 0 2px 8px #000; }
  #hud-timer.urgent { color: #ff5a3c; }
  #hud-score { font-size: 13px; letter-spacing: 1px; margin-top: 2px; text-shadow: 0 1px 4px #000; }
  #hud-score .sol { color: #ffb347; font-weight: 700; }
  #hud-score .bas { color: #57c8c0; font-weight: 700; }
  #hud-score .mid { color: #b09a78; margin: 0 12px; }
  #hud-bomb { margin-top: 6px; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-shadow: 0 1px 4px #000; }
  .bomb-live { color: #ff5a3c; }
  .bomb-carry { color: #ffb347; }
  #hud-killfeed { position: absolute; top: 92px; right: 16px; text-align: right; font-size: 12px;
    color: #f5ead2; text-shadow: 0 1px 4px #000; }
  #hud-killfeed div { margin-bottom: 3px; background: rgba(23,16,9,.55); padding: 3px 8px; border-radius: 3px; }
  #hud-crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; --gap: 8px; }
  #hud-crosshair .ch { position: absolute; background: #f5ead2; box-shadow: 0 0 3px #000; }
  #hud-crosshair .ch-dot { position: absolute; left: -1.5px; top: -1.5px; width: 3px; height: 3px;
    background: #f5ead2; border-radius: 50%; }
  #hud-crosshair .l { left: calc(-1 * var(--gap) - 9px); top: -1px; width: 9px; height: 2px; }
  #hud-crosshair .r { left: var(--gap); top: -1px; width: 9px; height: 2px; }
  #hud-crosshair .t { left: -1px; top: calc(-1 * var(--gap) - 9px); width: 2px; height: 9px; }
  #hud-crosshair .b { left: -1px; top: var(--gap); width: 2px; height: 9px; }
  #hud-crosshair.ads .l, #hud-crosshair.ads .r, #hud-crosshair.ads .t, #hud-crosshair.ads .b { opacity: .55; }
  #hud-hitmarker { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-size: 15px; font-weight: 800; color: #ff5a3c; opacity: 0; text-shadow: 0 0 6px #000; }
  #hud-hitmarker.show { opacity: 1; }
  #hud-bottom { position: absolute; left: 18px; right: 18px; bottom: 16px; display: flex;
    justify-content: space-between; align-items: flex-end; }
  #hud-hpbar { width: 220px; height: 14px; background: rgba(0,0,0,.55); border: 1px solid #55462f; }
  #hud-hpfill { height: 100%; width: 100%; background: #ffb347; }
  #hud-hptext { font-size: 20px; font-weight: 700; margin-top: 4px; text-shadow: 0 1px 4px #000; }
  #hud-armor { font-size: 12px; color: #57c8c0; margin-top: 2px; text-shadow: 0 1px 4px #000; }
  #hud-right { text-align: right; }
  #hud-ammo { font-size: 26px; font-weight: 700; text-shadow: 0 1px 4px #000; }
  #hud-weapon { font-size: 13px; color: #b09a78; }
  #hud-money { font-size: 20px; font-weight: 700; color: #ffb347; margin-top: 4px; text-shadow: 0 1px 4px #000; }
  #hud-hint { position: absolute; bottom: 92px; left: 0; right: 0; text-align: center;
    font-size: 13px; color: #f5ead2; text-shadow: 0 1px 4px #000; }
  #hud-banner { position: absolute; top: 26%; left: 0; right: 0; text-align: center; }
  #hud-banner .b-main { font-size: 44px; font-weight: 800; letter-spacing: 4px; text-shadow: 0 3px 14px #000; }
  #hud-banner .b-main.win { color: #ffb347; }
  #hud-banner .b-main.lose { color: #57c8c0; }
  #hud-banner .b-sub { font-size: 15px; color: #b09a78; margin-top: 6px; text-shadow: 0 1px 4px #000; }
  #hud-buy { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 560px; max-width: 92vw; background: rgba(23,16,9,.92); border: 1px solid #55462f;
    padding: 16px 18px; pointer-events: auto; }
  .buy-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; color: #ffb347; margin-bottom: 10px; }
  .buy-title span { float: right; color: #f5ead2; }
  .buy-item { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; cursor: pointer;
    border: 1px solid transparent; }
  .buy-item:hover { background: rgba(255,179,71,.12); border-color: #55462f; }
  .buy-item.owned { opacity: .55; }
  .buy-item.poor { opacity: .45; }
  .bi-name { font-weight: 700; width: 150px; }
  .bi-desc { flex: 1; color: #b09a78; font-size: 12px; }
  .bi-price { color: #ffb347; font-weight: 700; }
  .buy-foot { margin-top: 10px; font-size: 12px; color: #b09a78; }
  #hud-start { position: absolute; inset: 0; background: rgba(23,16,9,.82); display: flex;
    flex-direction: column; align-items: center; justify-content: center; text-align: center;
    pointer-events: auto; }
  .start-title { font-size: 64px; font-weight: 800; letter-spacing: 10px; color: #ffb347;
    text-shadow: 0 4px 24px rgba(255,179,71,.4); }
  .start-sub { font-size: 16px; color: #57c8c0; margin-top: 4px; letter-spacing: 1px; }
  .start-body { font-size: 14px; color: #f5ead2; line-height: 1.7; margin-top: 22px; }
  #start-btn { margin-top: 26px; padding: 14px 42px; font-size: 17px; font-weight: 700; letter-spacing: 2px;
    color: #171009; background: #ffb347; border: none; cursor: pointer; }
  #start-btn:hover { background: #ffc46b; }
  .start-note { margin-top: 18px; font-size: 12px; color: #b09a78; }
  #hud-damage { position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(255,40,20,.45) 100%); }
  #hud-damage.show { animation: dmg .5s ease-out; }
  @keyframes dmg { 0% { opacity: 1; } 100% { opacity: 0; } }
  #hud-flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: #fff; }
  #hud-flash.show { animation: fl 1.6s ease-out; }
  @keyframes fl { 0% { opacity: .95; } 100% { opacity: 0; } }
  #hud-lock { position: absolute; top: 50%; left: 50%; transform: translate(-50%, 90px); font-size: 13px;
    color: #b09a78; text-shadow: 0 1px 4px #000; }
  #scope { position: fixed; inset: 0; pointer-events: none; display: none;
    background: radial-gradient(circle at center, transparent 31%, #000 32%); }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<div id="hud-lock" class="hidden">Click the game to aim</div>
<div id="scope"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
